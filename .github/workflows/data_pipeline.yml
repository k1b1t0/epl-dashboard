name: EPL End-to-End Data Pipeline
run-name: Triggered by ${{ github.actor }}

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SEASONS: "2023,2024,2025,2026"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Raw Data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            raw-data-${{ runner.os }}-

      - name: Set up Python & UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Step 1 - Ingestion (REST API to Parquet Data Lake)
        run: |
          uv run python -m ingestion.rest_api_football_pipeline

      - name: Step 2 - Load (PySpark Parquet to Postgres DWH)
        run: |
          uv run python -m load.parquet_to_postgres_pipeline

      - name: Step 3 - Transform (dbt Run & Data Tests)
        run: |
          cd transform
          uv run dbt run --profiles-dir .
          uv run dbt test --profiles-dir .

      - name: Step 4 - Commit & Push Finished Season Parquet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*/matches_full_*.parquet || true
          if git diff --staged --quiet; then
            echo "No new finished season parquet files to commit."
          else
            git commit -m "chore(data): auto-save finished season parquet files [skip ci]"
            git push
          fi