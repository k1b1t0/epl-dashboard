version: 2

models:
  - name: stg_matches
    description: "Bang staging da lam sach tho va cast kieu du lieu cho cac tran dau EPL"
    columns:
      - name: match_id
        description: "Ma dinh danh tran dau (Primary Key)"
        tests:
          - unique
          - not_null
      - name: season
        description: "Nam mua giai"
        tests:
          - not_null
      - name: utc_date
        description: "Thoi gian thi dau UTC"
        tests:
          - not_null
      - name: match_status
        description: "Trang thai tran dau (FINISHED, SCHEDULED...)"
        tests:
          - accepted_values:
              arguments:
                values:
                  - SCHEDULED
                  - TIMED
                  - IN_PLAY
                  - PAUSED
                  - FINISHED
                  - SUSPENDED
                  - POSTPONED
                  - CANCELLED
                  - AWARDED
      - name: stage
        description: "Giai doan thi dau"
        tests:
          - accepted_values:
              arguments:
                values:
                  - FINAL
                  - THIRD_PLACE
                  - SEMI_FINALS
                  - QUARTER_FINALS
                  - LAST_16
                  - LAST_32
                  - LAST_64
                  - ROUND_4
                  - ROUND_3
                  - ROUND_2
                  - ROUND_1
                  - GROUP_STAGE
                  - PRELIMINARY_ROUND
                  - QUALIFICATION
                  - QUALIFICATION_ROUND_1
                  - QUALIFICATION_ROUND_2
                  - QUALIFICATION_ROUND_3
                  - PLAYOFF_ROUND_1
                  - PLAYOFF_ROUND_2
                  - PLAYOFFS
                  - REGULAR_SEASON
                  - CLAUSURA
                  - APERTURA
                  - CHAMPIONSHIP_ROUND
                  - RELEGATION_ROUND

  - name: stg_matches_referees
    description: "Bang staging danh sach trong tai bat cac tran dau"
    columns:
      - name: referee_id
        description: "Ma dinh danh trong tai"
        tests:
          - not_null
      - name: referee_name
        description: "Ten trong tai"
        tests:
          - not_null
      - name: match_dlt_id
        description: "Foreign key ket noi den bang matches (_dlt_id)"
        tests:
          - not_null

  - name: stg_teams
    description: "Bang staging thong tin cac doi bong EPL theo mua"
    columns:
      - name: team_id
        description: "Ma dinh danh doi bong"
        tests:
          - not_null
      - name: season
        description: "Nam mua giai"
        tests:
          - not_null
      - name: team_name
        description: "Ten doi bong"
        tests:
          - not_null

  - name: stg_teams_squad
    description: "Bang staging danh sach cau thu thi dau cho cac doi bong theo mua"
    columns:
      - name: player_id
        description: "Ma dinh danh cau thu"
        tests:
          - not_null
      - name: team_id
        description: "Ma dinh danh doi bong chu quan"
        tests:
          - not_null
      - name: season
        description: "Nam mua giai"
        tests:
          - not_null
      - name: player_name
        description: "Ten cau thu"
        tests:
          - not_null
