version: 2

models:
  - name: stg_matches
    description: "Bang staging da lam sach tho va cast kieu du lieu cho cac tran dau EPL"
    columns:
      - name: match_id
        description: "Ma dinh danh tran dau (Primary Key)"
        tests:
          - unique
          - not_null
      - name: season
        description: "Nam mua giai"
        tests:
          - not_null
      - name: utc_date
        description: "Thoi gian thi dau UTC"
        tests:
          - not_null
      - name: match_status
        description: "Trang thai tran dau (FINISHED, SCHEDULED...)"
        tests:
          - accepted_values:
              arguments:
                values:
                  - SCHEDULED
                  - TIMED
                  - IN_PLAY
                  - PAUSED
                  - FINISHED
                  - SUSPENDED
                  - POSTPONED
                  - CANCELLED
                  - AWARDED
      - name: stage
        description: "Giai doan thi dau"
        tests:
          - accepted_values:
              arguments:
                values:
                  - FINAL
                  - THIRD_PLACE
                  - SEMI_FINALS
                  - QUARTER_FINALS
                  - LAST_16
                  - LAST_32
                  - LAST_64
                  - ROUND_4
                  - ROUND_3
                  - ROUND_2
                  - ROUND_1
                  - GROUP_STAGE
                  - PRELIMINARY_ROUND
                  - QUALIFICATION
                  - QUALIFICATION_ROUND_1
                  - QUALIFICATION_ROUND_2
                  - QUALIFICATION_ROUND_3
                  - PLAYOFF_ROUND_1
                  - PLAYOFF_ROUND_2
                  - PLAYOFFS
                  - REGULAR_SEASON
                  - CLAUSURA
                  - APERTURA
                  - CHAMPIONSHIP_ROUND
                  - RELEGATION_ROUND
